name: Deploy duckmate web (production)

# duckmate/ 변경이 master 에 머지될 때 덕메이트 서비스 본체(apps/web)를 자체 Vercel 프로젝트로 배포한다.
# 허브(deploy.yml)·isitnormal(deploy-isitnormal.yml)과 별개 프로젝트. 패턴은 deploy-isitnormal.yml 을 따른다.
#
# ── Vercel 프로젝트 설정 (소유자가 대시보드에서 1회) ──
#   Framework Preset      : Next.js
#   Root Directory        : duckmate/apps/web      ("Include source files outside of the Root Directory" 켜기 — pnpm 워크스페이스)
#   Node.js Version       : 22.x                   (Settings → General)
#   Install / Build       : duckmate/apps/web/vercel.json 이 명시한다 (installCommand = `cd ../.. && pnpm install --frozen-lockfile`,
#                           buildCommand = `cd ../.. && pnpm --filter @duckmate/web build`). 대시보드 값은 비워 둔다(vercel.json 우선).
#   Git 자동배포          : 끄기 권장 — 이 워크플로와 둘 다 켜지면 같은 push 에 프로덕션 배포가 2번 발생한다(DEPLOY-CHECKLIST.md 1-2).
#   환경변수(Production)  : duckmate/.env.example 의 apps/web 키 전부. 필수 = NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY,
#                           SUPABASE_SERVICE_ROLE_KEY, NEXT_PUBLIC_SITE_URL, NEXT_PUBLIC_COMPANY_URL, IDENTITY_VERIFIER=mock,
#                           IDENTITY_MOCK_ALLOWLIST, IDENTITY_CI_SALT(회전 금지), PHONE_HASH_SALT, CONSENT_HASH_SALT, AUTH_GATE_SECRET,
#                           PAYMENTS_ENABLED=false, NEXT_PUBLIC_VAPID_PUBLIC_KEY (G2_security.md §G3-2, 15_auth.md §4, 20_notifications.md §18).
#
# ── GitHub Secrets (리포 Settings → Secrets and variables → Actions) ──
#   DM_WEB_VERCEL_TOKEN       : vercel.com → Account Settings → Tokens
#   DM_WEB_VERCEL_ORG_ID      : `npx vercel link` 를 duckmate/apps/web 에서 실행 → .vercel/project.json 의 orgId
#   DM_WEB_VERCEL_PROJECT_ID  : 같은 파일의 projectId (또는 대시보드 Project Settings → General → Project ID)
#   셋 중 하나라도 없으면 ::warning 후 건너뛴다(빨간 X 방지).
#
# vercel 명령은 저장소 루트에서 실행한다: `vercel pull` 이 Root Directory 설정을 받아 오고 `vercel build` 가 그 하위 폴더에서 빌드,
# 산출물 `.vercel/output` 은 루트에 생긴다(`vercel deploy --prebuilt` 가 이를 업로드). 빌드 env 는 `vercel pull --environment=production`
# 이 내려주는 Vercel 프로젝트 환경변수다 — GitHub Secrets 에 앱 env 를 중복 등록하지 않는다.

on:
  push:
    branches: [master]
    paths:
      - "duckmate/**"
      - ".github/workflows/deploy-duckmate-web.yml"
  workflow_dispatch: {}

concurrency:
  group: vercel-duckmate-web
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'dydrms6388-sudo/project-hub' }}
    env:
      VERCEL_ORG_ID: ${{ secrets.DM_WEB_VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.DM_WEB_VERCEL_PROJECT_ID }}
      NEXT_TELEMETRY_DISABLED: "1"
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard — secrets present?
        id: guard
        run: |
          if [ -z "${{ secrets.DM_WEB_VERCEL_TOKEN }}" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::duckmate web Vercel 시크릿(DM_WEB_VERCEL_TOKEN / DM_WEB_VERCEL_ORG_ID / DM_WEB_VERCEL_PROJECT_ID)이 없어 배포를 건너뜁니다. duckmate/docs/DEPLOY_LOG.md §2 참고."
            echo "### ⏭️ duckmate web 배포 건너뜀 — Vercel 시크릿 미등록" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup pnpm
        if: steps.guard.outputs.ok == 'true'
        uses: pnpm/action-setup@v4
        with:
          package_json_file: duckmate/package.json   # packageManager: pnpm@10.x 를 그대로 사용

      - name: Setup Node 22
        if: steps.guard.outputs.ok == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: duckmate/pnpm-lock.yaml

      - name: Install (frozen lockfile)
        if: steps.guard.outputs.ok == 'true'
        working-directory: duckmate
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        if: steps.guard.outputs.ok == 'true'
        working-directory: duckmate
        run: pnpm -r typecheck

      - name: Unit tests
        if: steps.guard.outputs.ok == 'true'
        working-directory: duckmate
        run: pnpm -r test

      - name: Legal placeholder scan (경고만, 차단 X — 브리프 절대 규칙 4)
        if: steps.guard.outputs.ok == 'true'
        working-directory: duckmate
        run: node scripts/check-legal-placeholders.mjs

      - name: Install Vercel CLI
        if: steps.guard.outputs.ok == 'true'
        run: npm install -g vercel@latest

      - name: Pull Vercel project settings + production env
        if: steps.guard.outputs.ok == 'true'
        run: vercel pull --yes --environment=production --token="${{ secrets.DM_WEB_VERCEL_TOKEN }}"

      - name: Build (vercel build --prod)
        if: steps.guard.outputs.ok == 'true'
        run: vercel build --prod --yes --token="${{ secrets.DM_WEB_VERCEL_TOKEN }}"

      - name: Locate prebuilt output
        if: steps.guard.outputs.ok == 'true'
        run: |
          if [ -d .vercel/output ]; then
            echo "prebuilt output: $(pwd)/.vercel/output"
          elif [ -d duckmate/apps/web/.vercel/output ]; then
            echo "::error::.vercel/output 이 Root Directory 안에 생성되었습니다. Vercel CLI 버전별 동작 차이 — DEPLOY_LOG.md §6 참고"
            exit 1
          else
            echo "::error::.vercel/output 없음 — vercel build 실패 로그를 확인하세요"
            exit 1
          fi

      - name: Deploy to production (prebuilt)
        if: steps.guard.outputs.ok == 'true'
        run: |
          url=$(vercel deploy --prebuilt --prod --yes --token="${{ secrets.DM_WEB_VERCEL_TOKEN }}")
          echo "Deployed: $url"
          {
            echo "### ✅ duckmate web 프로덕션 배포 완료"
            echo ""
            echo "- URL: $url"
            echo "- commit: ${{ github.sha }}"
            echo "- 배포 후 스모크: duckmate/docs/DEPLOY_LOG.md §7 (헤더 5종·robots·sitemap·/legal/terms 200·/admin 404)"
          } >> "$GITHUB_STEP_SUMMARY"
