name: StockLab data pipeline (종목·시세·재무·배당 → Supabase)

# 평일 05:30 KST (UTC 20:30 전일) 에 stocklab/pipeline/run_daily.py 실행.
#   stocks → prices → financials(월요일/입력) → dividends → /api/cron/daily-pick 트리거(보조)
# 요일별 DART 쿼터 분산·fallback 규칙은 stocklab/pipeline/README.md 참고.
#
# Secrets (Settings → Secrets → Actions):
#   SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY   필수
#   DART_API_KEY                              권장 (없으면 pykrx fallback)
#   SITE_URL, CRON_SECRET                     권장 (없으면 트리거 스킵)
#   KRX_ID, KRX_PW                            선택 (pykrx 의 KRX 로그인 — 비로그인 시 일부 조회 실패 가능)
#
# 비용 $0: GitHub Actions 무료 분 + Supabase Free + 공개 API. 다른 워크플로와 독립(Vercel 배포 없음).

on:
  schedule:
    - cron: "30 20 * * 1-5"   # 05:30 KST 월~금
  workflow_dispatch:
    inputs:
      full_backfill:
        description: "시세 20년 백필 (--full, 최초 1회. 수 시간 소요 → timeout 주의)"
        type: boolean
        default: false
      with_financials:
        description: "요일 무관 DART 재무 적재 (--with-financials)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: stocklab-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    if: ${{ github.repository == 'dydrms6388-sudo/project-hub' }}
    defaults:
      run:
        working-directory: stocklab/pipeline
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: stocklab/pipeline/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Unit tests (transforms)
        run: python -m pytest -q

      - name: Verify sources (report only)
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: python verify_sources.py

      - name: Run daily pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          PYTHONUNBUFFERED: "1"
        run: |
          args=""
          if [ "${{ inputs.full_backfill }}" = "true" ]; then args="$args --full"; fi
          if [ "${{ inputs.with_financials }}" = "true" ]; then args="$args --with-financials"; fi
          echo "run_daily.py $args"
          python run_daily.py $args
