name: 정화 머리방 콘텐츠 초안 (매일 1개)

# 매일 KST 06:10 에 salon/content/drafts/YYYY-MM-DD.md 초안 1개를 생성해 master 에 커밋한다.
# 자동 게시는 하지 않는다 — 사장님이 확인·수정한 뒤 직접 올린다.
#
# 활성화: 리포 Settings → Secrets → Actions 에 ANTHROPIC_API_KEY 등록.
#   없으면 스크립트가 경고만 남기고 성공 종료한다 (커밋 없음).
#
# ⚠️ 유료 API 호출이 하루 1번 발생한다. 끄려면 이 워크플로를 disable 하거나 시크릿을 지운다.

on:
  schedule:
    - cron: "10 21 * * *"   # 06:10 KST
  workflow_dispatch:
    inputs:
      date:
        description: "생성할 날짜 (YYYY-MM-DD, 비우면 오늘 KST)"
        required: false
        default: ""
      force:
        description: "같은 날짜 초안이 있어도 다시 생성"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: salon-daily-post
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'dydrms6388-sudo/project-hub' }}
    defaults:
      run:
        working-directory: salon
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: salon/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Generate draft
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SALON_POST_DATE: ${{ inputs.date }}
        run: npm run daily-post ${{ inputs.force && '-- --force' || '' }}

      - name: Commit & push draft
        run: |
          git config user.name "salon-content-bot"
          git config user.email "actions@github.com"
          git add content/drafts
          if git diff --cached --quiet; then
            echo "새 초안 없음 — 커밋 스킵"; exit 0
          fi
          git commit -m "content(salon): $(date -u -d '+9 hours' +%F) 콘텐츠 초안 [skip ci]"
          git pull --rebase origin master
          git push origin master
