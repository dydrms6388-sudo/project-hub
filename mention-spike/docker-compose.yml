# 상시 동작 구성: Redis(AOF 영속) + api + engine + collector + notifier
# docker compose --env-file .env up -d
services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes: [redis-data:/data]
    restart: unless-stopped

  api:
    build: .
    command: ["node", "src/api/server.js"]
    env_file: .env
    environment: { REDIS_URL: "redis://redis:6379" }
    ports: ["8787:8787"]
    depends_on: [redis]
    restart: unless-stopped

  engine:
    build: .
    command: ["node", "src/workers/engine.js"]
    env_file: .env
    environment: { REDIS_URL: "redis://redis:6379" }
    depends_on: [redis]
    restart: unless-stopped

  collector:
    build: .
    command: ["node", "src/workers/collector.js"]
    env_file: .env
    environment: { REDIS_URL: "redis://redis:6379" }
    depends_on: [redis]
    restart: unless-stopped

  notifier:
    build: .
    command: ["node", "src/workers/notifier.js"]
    env_file: .env
    environment: { REDIS_URL: "redis://redis:6379" }
    depends_on: [redis]
    restart: unless-stopped

volumes:
  redis-data:
